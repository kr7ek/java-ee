<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<title>Nuovo Manga</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
	<div class="container">
		<h1>Nuovo Manga</h1>

		<form th:action="@{/manga}" th:object="${manga}" method="post">

			Titolo: <input type="text" th:field="*{titolo}" /><br>
			Autore: <input type="text" th:field="*{autore}" /><br>
			Prezzo: <input type="number" step="0.01" th:field="*{prezzo}" /><br>

			Fumetteria:
			<select th:field="*{fumetteria}">
				<option th:each="f : ${fumetterie}" th:value="${f.id}" th:text="${f.nome}">
				</option>
			</select>

			<button type="submit">Salva</button>
		</form>
		<a href="/manga" class="link-home"> indietro </a>
	</div>
</body>

</html>
