<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Nuova Fumetteria</title>
</head>
<body>

<h1>Nuova Fumetteria</h1>

<form th:action="@{/fumetterie}" th:object="${fumetteria}" method="post">
    Nome: <input type="text" th:field="*{nome}" /><br>
    Città: <input type="text" th:field="*{citta}" /><br>
    <button type="submit">Salva</button>
</form>

</body>
</html>
